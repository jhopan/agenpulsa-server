name: Release

# Rilis otomatis: push tag v* -> build amd64+arm64 -> upload ke GitHub Releases.
# "Latest" otomatis = rilis terbaru yang bukan pre-release/draft.
#
# Cara rilis:
#   git tag v1.3.0
#   git push origin v1.3.0
#
# Hasil (di halaman Releases):
#   agenpulsa-server-linux-amd64
#   agenpulsa-server-linux-arm64
#   agenpulsa-server_<ver>_linux_amd64.tar.gz   (binary + web + helper)
#   agenpulsa-server_<ver>_linux_arm64.tar.gz
#   checksums.txt
on:
  push:
    tags:
      - 'v*'
  # Manual run dari tab Actions (buat tes build tanpa rilis).
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: '1.25.x'

jobs:
  # ---------- 1. test dulu, jangan rilis kalau gagal ----------
  test:
    name: Test & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -count=1

  # ---------- 2. build 2 arsitektur ----------
  build:
    name: Build ${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
          - goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Tentukan versi
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build -trimpath             -ldflags "-s -w \
              -X github.com/jhopan/agenpulsa-server/internal/version.Version=${{ steps.ver.outputs.version }} \
              -X github.com/jhopan/agenpulsa-server/internal/version.Commit=${{ steps.ver.outputs.commit }} \
              -X github.com/jhopan/agenpulsa-server/internal/version.BuildDate=${{ steps.ver.outputs.date }}"             -o dist/agenpulsa-server-linux-${{ matrix.goarch }} .

      - name: Verifikasi binary
        run: |
          file dist/agenpulsa-server-linux-${{ matrix.goarch }} | grep -q 'ELF 64-bit' && echo "ELF OK"

      - name: Paket tar.gz (binary + web + helper)
        run: |
          VER="${{ steps.ver.outputs.version }}"
          PKG="agenpulsa-server_${VER#v}_linux_${{ matrix.goarch }}"
          mkdir -p "dist/$PKG"
          cp dist/agenpulsa-server-linux-${{ matrix.goarch }} "dist/$PKG/agenpulsa-server"
          cp -r web "dist/$PKG/web"
          cp -r helper "dist/$PKG/helper"
          cp manage.sh "dist/$PKG/" 2>/dev/null || true
          cp DEPLOY.md "dist/$PKG/" 2>/dev/null || true
          tar -C dist -czf "dist/$PKG.tar.gz" "$PKG"
          rm -rf "dist/$PKG"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goarch }}
          path: |
            dist/agenpulsa-server-linux-${{ matrix.goarch }}
            dist/*.tar.gz
          retention-days: 7

  # ---------- 3. rilis: versi (vX.Y.Z) + latest ----------
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download semua artifact
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Siapkan aset (versi + nama stabil utk latest)
        id: prep
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          cd dist
          # nama stabil: URL /latest/download/<nama> tidak berubah antar versi
          cp "agenpulsa-server_${VERSION}_linux_amd64.tar.gz" agenpulsa-server-latest-linux-amd64.tar.gz
          cp "agenpulsa-server_${VERSION}_linux_arm64.tar.gz" agenpulsa-server-latest-linux-arm64.tar.gz
          sha256sum agenpulsa-server-linux-* *.tar.gz > checksums.txt
          ls -lah

      - name: Catatan rilis dari commits
        id: notes
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null | grep -E '^v[0-9]' || true)
          if [ -z "$PREV" ]; then
            PREV=$(git tag --list 'v*' --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)
          fi
          {
            echo "# AgenPulsa Server ${GITHUB_REF_NAME}"
            echo ""
            echo "> **By JhopanStore** — [repo](https://github.com/${{ github.repository }})"
            echo ""
            echo "## Perubahan"
            echo ""
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty=format:"- %s" "${PREV}..${GITHUB_REF_NAME}"
            else
              git log --no-merges --pretty=format:"- %s" HEAD~20..HEAD
            fi
            echo ""
            echo ""
            echo "## Install / Update"
            echo ""
            echo '```bash'
            echo "# install baru"
            echo "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/master/install.sh | bash"
            echo ""
            echo "# update ke latest"
            echo "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/master/install.sh | bash -s -- update"
            echo ""
            echo "# atau kalau CLI ap sudah terpasang"
            echo "ap update"
            echo '```'
            echo ""
            echo "## Binary"
            echo ""
            echo "| Platform | File |"
            echo "|---|---|"
            echo "| Linux x86_64 | `agenpulsa-server-linux-amd64` |"
            echo "| Linux ARM64 | `agenpulsa-server-linux-arm64` |"
            echo ""
            echo "Paket lengkap (binary + web + helper): `agenpulsa-server_${VERSION}_linux_*.tar.gz`"
          } > /tmp/notes.md
          cat /tmp/notes.md | head -20

      # --- 1) release berversi ---
      - name: Buat release versi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "AgenPulsa Server ${GITHUB_REF_NAME}" \
            --notes-file /tmp/notes.md \
            dist/agenpulsa-server-linux-amd64 \
            dist/agenpulsa-server-linux-arm64 \
            dist/agenpulsa-server_*_linux_*.tar.gz \
            dist/checksums.txt

      # --- 2) release "latest" (tag digeser paksa, selalu menunjuk build terbaru) ---
      - name: Geser tag latest
        run: |
          git tag -f latest
          git push origin latest --force

      - name: Buat ulang release latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.prep.outputs.VERSION }}"
          # hapus release latest lama (tag tetap, akan dipakai ulang)
          gh release delete latest --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true

          gh release create latest \
            --repo "$GITHUB_REPOSITORY" \
            --title "Latest Build" \
            --latest \
            --notes "Build otomatis dari versi terbaru AgenPulsa Server (by JhopanStore).

          Sekarang menunjuk ke **${GITHUB_REF_NAME}** (`${VERSION}`).

          URL stabil:
          - `https://github.com/${{ github.repository }}/releases/latest/download/agenpulsa-server-latest-linux-amd64.tar.gz`
          - `https://github.com/${{ github.repository }}/releases/latest/download/agenpulsa-server-latest-linux-arm64.tar.gz`
          - `https://github.com/${{ github.repository }}/releases/latest/download/checksums.txt`

          Untuk versi tertentu, lihat [daftar release](https://github.com/${{ github.repository }}/releases)." \
            dist/agenpulsa-server-latest-linux-amd64.tar.gz \
            dist/agenpulsa-server-latest-linux-arm64.tar.gz \
            dist/agenpulsa-server_${VERSION}_linux_amd64.tar.gz \
            dist/agenpulsa-server_${VERSION}_linux_arm64.tar.gz \
            dist/checksums.txt
