<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgenPulsa — Login</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
*{box-sizing:border-box}
body{font-family:system-ui;background:#f2f4f8;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.c{background:#fff;padding:36px;border-radius:16px;box-shadow:0 2px 16px rgba(0,0,0,.09);width:340px}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.logo .dot{width:38px;height:38px;border-radius:10px;background:#101828;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.logo b{font-size:19px}.logo small{display:block;color:#667085;font-size:12px}
label{font-size:13px;color:#344054;font-weight:600;display:block;margin:10px 0 4px}
input{width:100%;padding:10px;margin:0 0 4px;border:1px solid #d0d5dd;border-radius:8px;font-size:14px}
input:focus{outline:2px solid #1a7f37;border-color:#1a7f37}
button{width:100%;padding:11px;background:#1a7f37;color:#fff;border:0;border-radius:8px;font-weight:600;cursor:pointer;margin-top:14px;font-size:15px}
button:hover{background:#166f30}
.e{color:#b42318;font-size:14px;background:#fee4e2;padding:8px 12px;border-radius:8px;margin-bottom:10px}
.hint{color:#667085;font-size:12px;margin-top:14px;text-align:center}
</style>
</head>
<body>
<div class="c">
<div class="logo"><img src="/logo_agenpulsa_server.png" alt="AgenPulsa" style="width:42px;height:42px;border-radius:10px"><div><b>AgenPulsa</b><small>by JhopanStore</small></div></div>
<div class="e" id="err" style="display:none"></div>
<label>Username</label><input id="lu" placeholder="username" autofocus autocomplete="username">
<label>Password</label><input id="lp" type="password" placeholder="password" autocomplete="current-password">
<button id="lbtn">Login</button>
<div class="hint">Default admin/admin123 — ganti via SQLite settings (admin_user, admin_pass)</div>
</div>
<script>
document.getElementById('lbtn').onclick=async()=>{
  const e=document.getElementById('err');e.style.display='none';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:lu.value,password:lp.value})});
    if(!r.ok) throw new Error((await r.json()).error||r.status);
    location.href='/admin';
  }catch(ex){e.textContent=ex.message;e.style.display='block'}
};
lp.addEventListener('keydown',e=>{if(e.key==='Enter')lbtn.click()});
</script>
</body>
</html>
